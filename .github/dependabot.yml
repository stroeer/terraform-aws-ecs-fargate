# Dependabot rules for repos with GitHub topic "buzz"; entries for ecosystems a repo does not use are left out.
# Version updates: monthly, all updates (incl. majors) in one PR per ecosystem.
# Security updates: immediately, one PR per ecosystem across all directories.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 8
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories: ["**/*"]
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 8
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
      docker:
        patterns: ["*"]

  - package-ecosystem: "pre-commit"
    directories: ["/"]
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 8
    groups:
      pre-commit-security:
        applies-to: security-updates
        patterns: ["*"]
      pre-commit:
        patterns: ["*"]

  - package-ecosystem: "terraform"
    directories: ["**/*"]
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 8
    groups:
      terraform-security:
        applies-to: security-updates
        patterns: ["*"]
      terraform:
        patterns: ["*"]
